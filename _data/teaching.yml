- role: ta
  course: "The Social World"
  inst: "Columbia University"
  sems: "Fall 2023 with Dr. Ryan Hagen, Spring 2026 with Dr. Marissa E. Thompson"
  description: "Introduction to Sociology. Identification of the distinctive elements of sociological perspectives on society. Readings confront classical and contemporary approaches with key social issues that include power and authority, culture and communication, poverty and discrimination, social change, and popular uses of sociological concepts."

- role: ta
  course: "Social Theory"
  inst: "Barnard College"
  sems: "Spring 2024 with Dr. Andrew Anastasi"
  description: "Theoretical accounts of the rise and transformations of modern society in the 19th and 20th centuries. Theories studied include those of Adam Smith, Tocqueville, Marx, Durkheim, Max Weber, Roberto Michels. Selected topics: individual, society, and polity; economy, class, and status: organization and ideology; religion and society; moral and instrumental action." 
  
- role: ta
  course: "Methods for Social Research"
  inst: "Barnard College"
  sems: "Fall 2024 & Fall 2025 with Dr. Amy Zhou, Spring 2025 with Dr. Randa Serhan"
  description: "Introductory course in social scientific research methods. Provides a general overview of the ways sociologists collect information about social phenomena, focusing on how to collect data that are reliable and applicable to our research questions."
